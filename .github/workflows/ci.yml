name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:

jobs:
  macos:
    name: Tests (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - run: swift --version
      - run: swift test
      - run: swift run -c release BlurHashBenchmark

  linux:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.4.0-noble
    steps:
      - uses: actions/checkout@v5
      - run: swift test
      - run: swift run -c release BlurHashBenchmark

  embedded:
    name: BlurHashCore under Embedded Swift (WebAssembly)
    runs-on: ubuntu-latest
    container: swift:6.4.0-noble
    steps:
      - uses: actions/checkout@v5
      - run: |
          swift sdk install \
            https://download.swift.org/swift-6.4.0-release/wasm-sdk/swift-6.4.0-RELEASE/swift-6.4.0-RELEASE_wasm.artifactbundle.tar.gz \
            --checksum f07b7be3c586d92d7a07051fc6d303b87ebea67eadc40640ba59d5a8b79aa86d
      - run: swift build --swift-sdk swift-6.4.0-RELEASE_wasm-embedded --target BlurHashCore -c release
